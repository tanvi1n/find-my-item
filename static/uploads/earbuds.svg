<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_earbuds_svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.08" />
    </filter>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#grad_earbuds_svg)" />
  <g transform="translate(300, 180) scale(1.1)">
    <g filter="url(#shadow)">
      
    <g transform="translate(-50, -45)">
      <rect x="0" y="0" width="70" height="50" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3" />
      <circle cx="35" cy="25" r="3" fill="#22C55E" />
      <!-- Left Bud -->
      <g transform="translate(75, 10)">
        <circle cx="10" cy="10" r="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" />
        <rect x="7" y="18" width="6" height="20" rx="3" fill="#E2E8F0" />
      </g>
    </g>
    </g>
  </g>
  <text x="300" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#16A34A" text-anchor="middle" letter-spacing="0.5">WIRELESS EARBUDS</text>
  <text x="300" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#64748B" text-anchor="middle">White Bluetooth In-Ear Headphones</text>
  <circle cx="50" cy="50" r="14" fill="#16A34A" fill-opacity="0.1" />
  <circle cx="50" cy="50" r="6" fill="#16A34A" fill-opacity="0.6" />
  <text x="75" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748B" letter-spacing="1">CAMPUS PROPERTY VERIFIED</text>
</svg>