  <text x="300" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#64748B" text-anchor="middle">Hardcover Grid Journal (Calculus Notes)</text>
