      <line x1="30" y1="45" x2="55" y2="45" stroke="#94A3B8" stroke-width="2" />
      <!-- Spiral dots -->
      <circle cx="7" cy="15" r="3" fill="#94A3B8" />
      <circle cx="7" cy="35" r="3" fill="#94A3B8" />
      <circle cx="7" cy="55" r="3" fill="#94A3B8" />
      <circle cx="7" cy="75" r="3" fill="#94A3B8" />
