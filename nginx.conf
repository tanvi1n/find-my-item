# /etc/nginx/sites-available/lostfound
# AWS EC2 Ubuntu Nginx Configuration for Find-My-Item

server {
    listen 80;
    server_name _;  # Or your AWS public DNS / custom domain

    client_max_body_size 20M;

    # Static files served directly by Nginx for high performance
    location /static/ {
        alias /home/ubuntu/campus-lost-found/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy all dynamic requests to Gunicorn / Flask
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
